name: 버그 제보
description: 도슨트가 예상과 다르게 동작할 때
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 문제는 여기가 아니라 Security 탭의 **Report a vulnerability**로 알려 주세요.

        로그와 화면 캡처에 비밀값, 토큰, 실제 세션 전사, 개인 폴더 경로가 들어가지 않게 지워 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나
      description: 실제로 본 것과 기대한 것을 구분해 적어 주세요.
      placeholder: 세션을 골랐는데 작업 내용이 비어 있었어요. 이전 세션에서는 카드가 보였습니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      placeholder: |
        1. `docent` 실행
        2. 왼쪽 목록에서 세션 선택
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 도슨트 버전
      description: 터미널에서 `docent --version` 실행 결과
      placeholder: "0.15.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방법
      options:
        - 릴리스 tgz (npm install -g https://github.com/foxion37/videcoder-docent/releases/latest/download/videcoder-docent.tgz)
        - GitHub 저장소에서 설치 (npm install -g github:foxion37/videcoder-docent)
        - 저장소를 클론해서 npm start
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: "macOS 15.5 (Apple Silicon) / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 버전
      description: "`node -v`"
      placeholder: "v22.14.0"
    validations:
      required: true
  - type: input
    id: omp
    attributes:
      label: omp 버전
      description: "`omp --version` (로그인 여부도 함께 적어 주세요)"
      placeholder: "1.2.3, 로그인됨"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 브라우저
      description: 작은 창(PiP) 문제라면 꼭 적어 주세요. 열리지 않으면 브라우저가 Document PiP를 지원하지 않을 수 있습니다.
      placeholder: "Chrome 140 / Safari 19 / Firefox 145"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 로그와 오류 문구
      description: 서버 콘솔 출력이나 화면에 뜬 오류를 붙여 주세요. 비밀값·토큰·실제 전사·개인 경로는 지우고 붙여 주세요.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 비밀값, 개인 경로, 실제 세션 기록을 지웠습니다.
          required: true
        - label: 보안 문제가 아닙니다(보안 문제는 Security 탭의 비공개 제보를 씁니다).
          required: true
